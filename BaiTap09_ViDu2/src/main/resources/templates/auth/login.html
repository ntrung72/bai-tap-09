<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="auth-page">

<div class="auth-card">
    <div class="auth-brand">UTEShop</div>
    <h1>Đăng nhập</h1>
    <p class="auth-subtitle">Đăng nhập bằng username hoặc email</p>

    <div class="alert alert-error" th:if="${param.error}">
        Username/email hoặc password không đúng
    </div>

    <div class="alert alert-success" th:if="${param.logout}">
        Bạn đã đăng xuất
    </div>

    <form th:action="@{/login}"
          method="post">

        <div class="form-group">
            <label for="username">
                Username hoặc Email
            </label>

            <input
                id="username"
                type="text"
                name="username"
                placeholder="Nhập username hoặc email"
                required
                autofocus>
        </div>

        <div class="form-group">
            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Nhập password"
                required>
        </div>

        <button class="btn-login" type="submit">
            Đăng nhập
        </button>

    </form>
</div>

</body>
</html>
